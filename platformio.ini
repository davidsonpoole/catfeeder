; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Two ~1.94MB OTA slots instead of the stock 1.25MB, and no SPIFFS. See
; partitions.csv. Changing this needs a cable: OTA replaces only the app
; partition, never the table itself.
board_build.partitions = partitions.csv

; logf() carries printf's format attribute, which only means anything with this
; warning switched on.
build_flags = -Wformat
lib_deps = bblanchon/ArduinoJson@^7.0

; Flash over WiFi instead of USB: pio run -e esp32dev_ota -t upload
; The password lives in src/wifi_secrets.h (gitignored); this reads it from the
; environment so it never lands in the repo:
;     export CATFEEDER_OTA_PASSWORD='...'
; Override the address when mDNS does not work on the network you are on:
;     pio run -e esp32dev_ota -t upload --upload-port 192.168.1.244
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = catfeeder.local
upload_flags = --auth=${sysenv.CATFEEDER_OTA_PASSWORD}
